<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phone Lookup - Internet Track</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: #0f0c29;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
            padding: 40px 0;
        }
        .container {
            max-width: 900px;
        }
        .card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.5);
        }
        .glow-text {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }
        .form-control {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
        }
        .form-control:focus {
            background: rgba(255,255,255,0.1);
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
            color: white;
        }
        .form-control::placeholder {
            color: rgba(255,255,255,0.3);
        }
        .result-section {
            background: rgba(0,0,0,0.3);
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .linked-account {
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            padding: 12px 15px;
            margin-bottom: 8px;
            border-left: 3px solid #667eea;
            color: white;
        }
        .back-link {
            color: rgba(255,255,255,0.5);
            text-decoration: none;
        }
        .back-link:hover {
            color: white;
        }
        .text-muted-custom {
            color: rgba(255,255,255,0.5);
        }
        .loading {
            display: none;
            text-align: center;
            padding: 40px;
        }
        .loading .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(102, 126, 234, 0.1);
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .input-group-text {
            background: rgba(255,255,255,0.05);
            border-color: rgba(255,255,255,0.1);
            color: rgba(255,255,255,0.7);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <a href="/dashboard" class="back-link">
                <i class="bi bi-arrow-left"></i> Back
            </a>
            <h3 class="glow-text m-0">📱 Phone Intelligence</h3>
            <span></span>
        </div>
        
        <div class="card">
            <div class="row">
                <div class="col-md-12">
                    <div class="input-group mb-3">
                        <span class="input-group-text"><i class="bi bi-phone"></i></span>
                        <input type="text" class="form-control" id="phoneInput" placeholder="Enter phone number with country code (e.g., +1234567890)">
                        <button class="btn btn-primary" onclick="lookupPhone()">
                            <i class="bi bi-search me-2"></i>Lookup
                        </button>
                    </div>
                    <small class="text-muted-custom">
                        <i class="bi bi-info-circle"></i> Supports international numbers with country code
                    </small>
                </div>
            </div>
            
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p class="text-white-50">Searching phone intelligence...</p>
            </div>
            
            <div id="results" style="display: none;">
                <div class="result-section">
                    <div class="row">
                        <div class="col-md-6">
                            <p><strong style="color: white;">📌 Number:</strong> <span id="resultNumber" style="color: #667eea;"></span></p>
                            <p><strong style="color: white;">✅ Valid:</strong> <span id="resultValid"></span></p>
                            <p><strong style="color: white;">📌 Possible:</strong> <span id="resultPossible"></span></p>
                            <p><strong style="color: white;">🌍 Country:</strong> <span id="resultCountry"></span></p>
                        </div>
                        <div class="col-md-6">
                            <p><strong style="color: white;">📍 Location:</strong> <span id="resultLocation"></span></p>
                            <p><strong style="color: white;">📱 Carrier:</strong> <span id="resultCarrier"></span></p>
                            <p><strong style="color: white;">🕐 Timezone:</strong> <span id="resultTimezone"></span></p>
                            <p><strong style="color: white;">⚠️ Risk Score:</strong> <span id="resultRisk"></span></p>
                        </div>
                    </div>
                </div>
                
                <div class="result-section mt-3">
                    <h5 style="color: white;">🔗 Linked Accounts</h5>
                    <div id="linkedAccounts"></div>
                </div>
                
                <div class="result-section mt-3">
                    <h5 style="color: white;">💡 Suggestions</h5>
                    <ul id="suggestions" style="color: rgba(255,255,255,0.7);"></ul>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        function lookupPhone() {
            const phone = document.getElementById('phoneInput').value.trim();
            if (!phone) {
                alert('Please enter a phone number');
                return;
            }
            
            document.getElementById('loading').style.display = 'block';
            document.getElementById('results').style.display = 'none';
            
            fetch('/api/phone-lookup', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone_number: phone })
            })
            .then(res => res.json())
            .then(data => {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('results').style.display = 'block';
                
                document.getElementById('resultNumber').textContent = data.number || phone;
                document.getElementById('resultValid').textContent = data.valid ? '✅ Yes' : '❌ No';
                document.getElementById('resultValid').style.color = data.valid ? '#27c93f' : '#ff5f56';
                document.getElementById('resultPossible').textContent = data.possible ? '✅ Yes' : '❌ No';
                document.getElementById('resultPossible').style.color = data.possible ? '#27c93f' : '#ff5f56';
                document.getElementById('resultCountry').textContent = data.country || 'Unknown';
                document.getElementById('resultLocation').textContent = data.location || 'Unknown';
                document.getElementById('resultCarrier').textContent = data.carrier || 'Unknown';
                document.getElementById('resultTimezone').textContent = data.timezone || 'Unknown';
                
                const risk = data.risk_score || 0;
                const riskEl = document.getElementById('resultRisk');
                riskEl.textContent = `${risk}/100`;
                if (risk < 30) riskEl.style.color = '#27c93f';
                else if (risk < 60) riskEl.style.color = '#ffbd2e';
                else riskEl.style.color = '#ff5f56';
                
                const accountsEl = document.getElementById('linkedAccounts');
                accountsEl.innerHTML = '';
                if (data.linked_accounts && data.linked_accounts.length > 0) {
                    data.linked_accounts.forEach(acc => {
                        const div = document.createElement('div');
                        div.className = 'linked-account d-flex justify-content-between align-items-center';
                        div.innerHTML = `
                            <div>
                                <span style="font-size: 1.2rem;">${acc.icon}</span>
                                <strong style="margin-left: 10px;">${acc.platform}</strong>
                            </div>
                            <span class="badge bg-primary">${acc.confidence}%</span>
                        `;
                        accountsEl.appendChild(div);
                    });
                } else {
                    accountsEl.innerHTML = '<p class="text-muted-custom">No linked accounts found</p>';
                }
                
                const suggestionsEl = document.getElementById('suggestions');
                suggestionsEl.innerHTML = '';
                if (data.suggestions && data.suggestions.length > 0) {
                    data.suggestions.forEach(s => {
                        const li = document.createElement('li');
                        li.textContent = s;
                        suggestionsEl.appendChild(li);
                    });
                }
            })
            .catch(err => {
                document.getElementById('loading').style.display = 'none';
                alert('Error: ' + err.message);
            });
        }
        
        document.getElementById('phoneInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') lookupPhone();
        });
    </script>
</body>
</html>
