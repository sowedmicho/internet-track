<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internet Track - OSINT Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 30px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.5);
            padding: 40px;
        }
        .glow-text {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            transition: all 0.3s;
            padding: 12px 30px;
        }
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.4);
        }
        .feature-box {
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 25px;
            border: 1px solid rgba(255,255,255,0.08);
            text-align: center;
            color: white;
            transition: all 0.3s;
        }
        .feature-box:hover {
            transform: translateY(-5px);
            background: rgba(255,255,255,0.08);
        }
        .feature-icon {
            font-size: 2.5rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="card">
                    <div class="text-center mb-5">
                        <h1 class="display-2 fw-bold glow-text">🌐 Internet Track</h1>
                        <p class="text-white-50 lead">Advanced OSINT & Intelligence Platform</p>
                    </div>
                    
                    <div class="row g-4 mb-5">
                        <div class="col-md-3">
                            <div class="feature-box">
                                <div class="feature-icon">📍</div>
                                <h5 class="mt-3">IP Tracking</h5>
                                <small class="text-white-50">Track & geolocate visitors</small>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="feature-box">
                                <div class="feature-icon">📱</div>
                                <h5 class="mt-3">Phone Lookup</h5>
                                <small class="text-white-50">Find linked accounts</small>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="feature-box">
                                <div class="feature-icon">💻</div>
                                <h5 class="mt-3">Terminal</h5>
                                <small class="text-white-50">Command-line interface</small>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="feature-box">
                                <div class="feature-icon">🔍</div>
                                <h5 class="mt-3">OSINT Tools</h5>
                                <small class="text-white-50">Account discovery</small>
                            </div>
                        </div>
                    </div>
                    
                    <div class="text-center">
                        <a href="/login" class="btn btn-primary btn-lg">
                            <i class="bi bi-box-arrow-in-right me-2"></i>Get Started
                        </a>
                        <p class="text-white-50 mt-3"><small>🔒 Secure • For Educational Purposes Only</small></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
